<title>PropFirm Challenge Finder</title>
<style>
__GLOBALS__

  /* Committed single-theme: yellow-on-black is the product's identity, not a
     default. Every colour is painted explicitly so the page holds on either
     host ground. Tokens are lifted from the app's own globals.css. */
  :root {
    --bg: #000000; --bg-1: #0c0c0c; --bg-2: #141414; --bg-3: #1d1d1d;
    --ink: #f6f6f4; --ink-2: #bdbdb8; --ink-3: #86867f;
    --line: rgba(255,255,255,0.08); --line-2: rgba(255,255,255,0.15);
    --accent: #ffd400; --accent-hi: #ffe14d; --accent-ink: #100e00;
    --accent-dim: rgba(255,212,0,0.12); --accent-line: rgba(255,212,0,0.34);
    --warn: #ff9f1c; --bad: #ff5c5c; --good: #4ade80;
    --sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body { margin:0; background: var(--bg); color: var(--ink); font-family: var(--sans); line-height:1.55; -webkit-font-smoothing:antialiased; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  :focus-visible { outline: 2px solid var(--accent-hi); outline-offset: 2px; }

  /* Masthead ---------------------------------------------------------- */
  .masthead { position: sticky; top:0; z-index:20; background: rgba(0,0,0,0.88); backdrop-filter: blur(8px); border-bottom:1px solid var(--line); }
  .masthead .inner { max-width:66rem; margin:0 auto; padding:0.8rem 1.25rem; display:flex; align-items:center; gap:1.25rem; flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:0.55rem; }
  .logo { width:1.9rem; height:1.9rem; border-radius:0.4rem; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-weight:800; flex:none; }
  .wordmark { font-weight:700; letter-spacing:-0.01em; line-height:1.1; }
  .wordmark span { display:block; font-family:var(--mono); font-size:0.58rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--accent); font-weight:500; }
  nav.top { display:flex; gap:0.2rem; flex:1 1 auto; flex-wrap:wrap; }
  nav.top a { padding:0.35rem 0.7rem; border-radius:0.4rem; color:var(--ink-2); font-size:0.9rem; }
  nav.top a:hover { background:var(--bg-2); color:var(--ink); text-decoration:none; }
  nav.top a[aria-current="page"] { background:var(--bg-3); color:var(--ink); }

  h1 { font-size: clamp(1.55rem,3.6vw,2.2rem); line-height:1.15; margin:0.35rem 0 0; text-wrap:balance; letter-spacing:-0.02em; }
  h2 { font-size:1.1rem; margin:0 0 0.7rem; text-wrap:balance; }
  p { margin:0.5rem 0 0; color:var(--ink-2); }

  .actions { display:flex; gap:0.6rem; margin-top:1.4rem; flex-wrap:wrap; }

  .pill-bad { border-color:rgba(255,92,92,0.4); color:var(--bad); }
  .pills { display:flex; gap:0.35rem; flex-wrap:wrap; }

  /* Stat row ----------------------------------------------------------- */
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(8rem,1fr)); gap:0.75rem; }
  .stat { background:var(--bg-2); border:1px solid var(--line); border-radius:0.6rem; padding:0.85rem 1rem; }
  .stat b { display:block; font-family:var(--mono); font-size:1.5rem; font-variant-numeric:tabular-nums; color:var(--accent); line-height:1.2; }
  .stat span { font-size:0.78rem; color:var(--ink-3); }

  /* Questionnaire ------------------------------------------------------ */
  .progress { display:flex; gap:0.3rem; margin-bottom:1.6rem; }
  .progress i { height:3px; flex:1; border-radius:2px; background:var(--bg-3); transition:background .25s ease; }
  .progress i.done { background:var(--accent); }
  .choices { display:grid; gap:0.5rem; margin-top:1.2rem; }
  .choice { display:flex; align-items:baseline; gap:0.7rem; width:100%; text-align:left; cursor:pointer; background:var(--bg-2); color:var(--ink); border:1px solid var(--line); border-radius:0.6rem; padding:0.8rem 1rem; font:inherit; transition:border-color .15s ease,background .15s ease; }
  .choice:hover { border-color:var(--line-2); background:var(--bg-3); }
  .choice[aria-pressed="true"] { border-color:var(--accent); background:var(--accent-dim); }
  .choice b { font-weight:600; }
  .choice em { font-style:normal; color:var(--ink-3); font-size:0.85rem; }

  /* Results ------------------------------------------------------------ */
  .topmatch { display:flex; gap:1.5rem; align-items:flex-start; flex-wrap:wrap; }
  .ring { --pct:0; width:92px; height:92px; border-radius:50%; flex:none; background:conic-gradient(var(--accent) calc(var(--pct)*1%), var(--bg-3) 0); display:grid; place-items:center; }
  .ring > span { width:74px; height:74px; border-radius:50%; background:var(--bg-1); display:grid; place-items:center; font-family:var(--mono); font-size:1.25rem; font-weight:600; font-variant-numeric:tabular-nums; }
  /* :not(.ring) is load-bearing — `.topmatch > div` outranks `.ring` on
     specificity, and without it the ring stretches into an ellipse. */
  .topmatch > div:not(.ring) { flex:1 1 18rem; min-width:0; }

  ul.notes { list-style:none; padding:0; margin:0.8rem 0 0; display:grid; gap:0.4rem; }
  ul.notes li { display:flex; gap:0.55rem; font-size:0.9rem; color:var(--ink-2); }
  ul.notes li::before { content:"+"; color:var(--good); font-family:var(--mono); flex:none; }
  ul.notes.caveats li::before { content:"!"; color:var(--warn); }

  table { width:100%; border-collapse:collapse; font-size:0.87rem; }
  th,td { text-align:left; padding:0.45rem 0.5rem; border-bottom:1px solid var(--line); }
  th { font-family:var(--mono); font-size:0.64rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-3); font-weight:500; }
  td.num, th.num { text-align:right; font-family:var(--mono); font-variant-numeric:tabular-nums; }
  .bar { height:4px; border-radius:2px; background:var(--bg-3); overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--accent); }
  .scroll-x { overflow-x:auto; }

  .alts { display:grid; gap:0.6rem; margin-top:0.7rem; }
  .alt { display:flex; align-items:center; gap:0.9rem; background:var(--bg-2); border:1px solid var(--line); border-radius:0.6rem; padding:0.7rem 1rem; }
  .alt .score { font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:1.05rem; color:var(--accent); flex:none; width:3.2rem; }
  .alt .who { flex:1 1 auto; min-width:0; }
  .alt .who b { display:block; font-weight:600; font-size:0.92rem; }
  .alt .who span { font-size:0.8rem; color:var(--ink-3); }

  .elim ul { list-style:none; padding:0; margin:0.5rem 0 0; }
  .elim li { display:flex; justify-content:space-between; gap:1rem; padding:0.5rem 0; border-bottom:1px solid var(--line); font-size:0.9rem; }
  .elim .count { font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--bad); flex:none; }

  /* Directory ---------------------------------------------------------- */
  .filters { display:grid; grid-template-columns:repeat(auto-fit,minmax(10rem,1fr)); gap:0.8rem; }
  .field label { display:block; font-family:var(--mono); font-size:0.62rem; letter-spacing:0.12em; text-transform:uppercase; color:var(--ink-3); margin-bottom:0.3rem; }
  .field input, .field select { width:100%; font:inherit; font-size:0.9rem; background:var(--bg-2); color:var(--ink); border:1px solid var(--line-2); border-radius:0.5rem; padding:0.5rem 0.65rem; }
  .grid-cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(15rem,1fr)); gap:0.9rem; }
  .card { background:var(--bg-1); border:1px solid var(--line); border-radius:0.7rem; padding:1rem; display:flex; flex-direction:column; gap:0.6rem; }
  .card h3 { margin:0; font-size:0.98rem; }
  .card .firm { font-size:0.82rem; color:var(--ink-3); }



  .card .foot { margin-top:auto; display:flex; gap:0.4rem; flex-wrap:wrap; }

  .spec { display:grid; grid-template-columns:repeat(auto-fit,minmax(16rem,1fr)); gap:1.25rem; }
  .spec dl { margin:0; display:grid; gap:0; }
  .spec dl > div { display:flex; justify-content:space-between; gap:1rem; padding:0.45rem 0; border-bottom:1px solid var(--line); font-size:0.88rem; }
  .spec dt { color:var(--ink-3); }
  .spec dd { margin:0; font-variant-numeric:tabular-nums; text-align:right; }
  .unknown { color:var(--ink-3); font-family:var(--mono); font-size:0.8rem; }

  .empty { text-align:center; padding:3rem 1rem; color:var(--ink-3); }
  footer { margin-top:3rem; padding:1.25rem 0 0; border-top:1px solid var(--line); font-size:0.8rem; color:var(--ink-3); }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>

<header class="masthead">
  <div class="inner">
    <a class="brand" href="#/">
      <span class="logo" aria-hidden="true">P</span>
      <span class="wordmark">PropFirm<span>for dummies</span></span>
    </a>
    <nav class="top" id="nav" aria-label="Main"></nav>
  </div>
</header>

<div class="shell"><main id="app"></main>
  <footer><p id="foot"></p></footer>
</div>

<script type="application/json" id="catalogue">__CATALOGUE__</script>
<script>__ENGINE__</script>
<script>__ISLANDS__</script>
<script>
(function () {
  "use strict";
  var PF = window.PF, V = PF.vocab;
  var DATA = JSON.parse(document.getElementById("catalogue").textContent);
  var app = document.getElementById("app");

  var FIRMS = {};
  DATA.forEach(function (c) {
    var f = FIRMS[c.firm.slug] || (FIRMS[c.firm.slug] = { firm: c.firm, challenges: [] });
    f.challenges.push(c);
  });
  var FIRM_LIST = Object.keys(FIRMS).map(function (k) { return FIRMS[k]; })
    .sort(function (a, b) { return a.firm.name.localeCompare(b.firm.name); });

  document.getElementById("foot").textContent =
    DATA.length + " challenges from " + FIRM_LIST.length + " firms, scored by the product's own engine " +
    "running in your browser. Figures are unverified and " +
    DATA.filter(function (c) { return c.price == null; }).length +
    " challenges have no price or drawdown recorded yet — those rank last, deliberately.";

  var ROUTES = [["#/", "Home"], ["#/find", "Find my challenge"], ["#/browse", "Browse"],
                ["#/firms", "Firms"], ["#/compare", "Compare"],
                ["#/psychology", "Psychology"], ["#/tools", "Tools"]];

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function money(n) { return n == null ? null : "$" + Number(n).toLocaleString("en-US"); }
  function sizeLabel(n) { return n == null ? "—" : "$" + (n / 1000) + "K"; }
  function pct(n) { return n == null ? null : n + "%"; }
  function nk(v) { return v == null || v === "" ? '<span class="unknown">Not confirmed</span>' : esc(v); }
  function titleCase(s) { return String(s || "").replace(/_/g, " ").replace(/^./, function (m) { return m.toUpperCase(); }); }

  function ruleTone(v) { return v === "allowed" ? "" : v === "restricted" ? "pill-warn" : v === "prohibited" ? "pill-bad" : ""; }

  // ---- Home -------------------------------------------------------------
  // The real landing page from the app, mounted as an island. It was rewritten
  // by hand once and immediately drifted from the product; using the actual
  // component is the only way it stays in step.
  function viewHome() { return '<div id="island-home"></div>'; }

  // ---- Questionnaire ----------------------------------------------------
  var QUESTIONS = [
    { key:"market", title:"Which market do you trade?", options:[
      ["futures","Futures","ES, NQ, CL, GC and similar"],["forex","Forex","Currency pairs"],
      ["cfd","CFDs","Indices, commodities, shares"],["crypto","Crypto",""],
      ["multiple","Multiple markets","Don't narrow by market"]] },
    { key:"trading_style", title:"How would you describe your style?", options:[
      ["scalping","Scalping","Many trades, seconds to minutes"],["day_trading","Day trading","Flat by the close"],
      ["swing_trading","Swing trading","Positions held for days"],["news_trading","News trading","Around scheduled releases"],
      ["algorithmic","Algorithmic","Automated execution"],["mixed","A mix",""]] },
    { key:"holding_period", title:"How long do you hold a position?", options:[
      ["seconds","Seconds",""],["minutes","Minutes",""],["hours","Hours",""],
      ["overnight","Overnight",""],["several_days","Several days",""]] },
    { key:"overnight_required", title:"Do you need to hold overnight?", options:[
      ["yes","Yes","Essential to how I trade"],["sometimes","Sometimes","I'd rather have the option"],
      ["no","No","I'm flat by the close"]] },
    { key:"challenge_approach", title:"How do you want to approach the challenge?", options:[
      ["pass_fast","Pass it fast","Take more risk to clear the target quickly"],
      ["normal","Normal pace","No strong preference"],
      ["protect","Protect the account","Slower, but far less likely to breach"]] },
    { key:"risk_style", title:"How do you size your risk?", options:[
      ["aggressive","Aggressive","Larger size, bigger swings"],["balanced","Balanced",""],
      ["conservative","Conservative","Small size, tight losses"]] },
    { key:"budget", title:"What can you spend on the evaluation?", options:[
      ["under_50","Under $50",""],["50_100","$50 – $100",""],["100_200","$100 – $200",""],
      ["200_300","$200 – $300",""],["300_plus","$300+",""],["no_preference","No limit",""]] },
    { key:"desired_account_size", title:"What account size are you after?", options:[
      ["25000","$25K",""],["50000","$50K",""],["75000","$75K",""],["100000","$100K",""],
      ["150000","$150K",""],["no_preference","No preference",""]] },
    { key:"deal_breakers", multi:true, title:"Anything that's a deal-breaker?",
      hint:"Pick any that would rule a challenge out entirely. Skip if none apply.", options:[] }
  ];
  QUESTIONS[8].options = V.DEAL_BREAKERS.map(function (k) { return [k, V.DEAL_BREAKER_LABELS[k] || k, ""]; });

  var step = 0, answers = { deal_breakers: [] }, lastResult = null;

  function profile() {
    return { market: answers.market || null, trading_style: answers.trading_style || null,
      holding_period: answers.holding_period || null, news_trading: "sometimes",
      overnight_required: answers.overnight_required || null,
      challenge_approach: answers.challenge_approach || null, risk_style: answers.risk_style || null,
      deal_breakers: answers.deal_breakers, budget: answers.budget || null,
      desired_account_size: answers.desired_account_size || null, priorities: [],
      platform: null, ea_required: null, weekend_required: null };
  }

  function viewFind() {
    var q = QUESTIONS[step], chosen = answers[q.key] || (q.multi ? [] : null);
    var bars = "";
    for (var i = 0; i < QUESTIONS.length; i++) bars += '<i class="' + (i <= step ? "done" : "") + '"></i>';
    var h = '<div class="section"><div class="progress" role="progressbar" aria-valuemin="1" aria-valuemax="' +
      QUESTIONS.length + '" aria-valuenow="' + (step + 1) + '">' + bars + "</div>" +
      '<span class="eyebrow">Question ' + (step + 1) + " of " + QUESTIONS.length + "</span><h1>" +
      esc(q.title) + "</h1>" + (q.hint ? "<p>" + esc(q.hint) + "</p>" : "") + '<div class="choices">';
    q.options.forEach(function (o) {
      var on = q.multi ? chosen.indexOf(o[0]) !== -1 : chosen === o[0];
      h += '<button type="button" class="choice" aria-pressed="' + on + '" data-v="' + esc(o[0]) + '"><b>' +
        esc(o[1]) + "</b>" + (o[2] ? "<em>" + esc(o[2]) + "</em>" : "") + "</button>";
    });
    return h + '</div><div class="actions">' +
      (step > 0 ? '<button type="button" class="btn" data-act="back">Back</button>' : "") +
      '<button type="button" class="btn btn-primary" data-act="next">' +
      (step === QUESTIONS.length - 1 ? "See my matches" : "Continue") + "</button></div></div>";
  }

  function bindFind() {
    app.querySelectorAll(".choice").forEach(function (b) {
      b.addEventListener("click", function () {
        var q = QUESTIONS[step], v = b.getAttribute("data-v");
        if (q.multi) {
          var i = answers[q.key].indexOf(v);
          if (i === -1) answers[q.key].push(v); else answers[q.key].splice(i, 1);
        } else { answers[q.key] = v; }
        render();
      });
    });
    app.querySelectorAll("[data-act]").forEach(function (b) {
      b.addEventListener("click", function () {
        if (b.getAttribute("data-act") === "back") { step--; render(); return; }
        if (step === QUESTIONS.length - 1) { lastResult = PF.getChallengeRecommendations(profile(), DATA); location.hash = "#/results"; }
        else { step++; render(); }
      });
    });
  }

  function breakdownTable(rec) {
    var rows = (rec.score_breakdown || []).map(function (c) {
      var p = Math.round((c.ratio || 0) * 100);
      return "<tr><td>" + esc(V.CRITERION_LABELS[c.criterion] || c.criterion) +
        (c.boosted ? ' <span class="pill pill-accent">priority</span>' : "") + "</td>" +
        '<td style="width:42%"><div class="bar"><i style="width:' + p + '%"></i></div></td>' +
        '<td class="num">' + p + "%</td></tr>";
    }).join("");
    if (!rows) return "";
    return '<div class="panel"><h2>Why it scored that</h2><div class="scroll-x"><table><thead><tr>' +
      '<th>Criterion</th><th>Fit</th><th class="num">Score</th></tr></thead><tbody>' + rows +
      "</tbody></table></div></div>";
  }

  function viewResults() {
    if (!lastResult) { location.hash = "#/find"; return ""; }
    var recs = lastResult.recommendations || [], h = '<div class="section stack">';
    if (!recs.length) {
      h += '<div class="panel panel-accent"><span class="eyebrow">No match</span>' +
        "<h1>We couldn't find a challenge that meets every requirement.</h1>" +
        "<p>That combination is very restrictive. We'd rather say so than show you challenges that " +
        "conflict with what you asked for.</p></div>";
    } else {
      var t = recs[0];
      h += '<div class="panel panel-accent"><div class="topmatch">' +
        '<div class="ring" style="--pct:' + t.match_score + '"><span>' + t.match_score + "</span></div><div>" +
        '<span class="pill pill-accent">' + esc(t.label || PF.matchLabel(t.match_score)) + "</span>" +
        "<h1>" + esc(t.challenge.firm.name) + " — " + esc(t.challenge.name) + "</h1>" +
        "<p>" + sizeLabel(t.challenge.account_size) + " account · " + (money(t.challenge.price) || "price not confirmed") +
        " · " + (pct(t.challenge.max_drawdown_pct) || "drawdown not confirmed") + " max drawdown</p>";
      if (t.reasons && t.reasons.length)
        h += '<ul class="notes">' + t.reasons.slice(0, 4).map(function (r) { return "<li>" + esc(r) + "</li>"; }).join("") + "</ul>";
      if (t.warnings && t.warnings.length)
        h += '<ul class="notes caveats">' + t.warnings.slice(0, 3).map(function (r) { return "<li>" + esc(r) + "</li>"; }).join("") + "</ul>";
      h += '<div class="actions"><a class="btn btn-sm" href="#/c/' + esc(t.challenge.slug) + '">Full details</a></div>';
      h += "</div></div></div>" + breakdownTable(t);
      if (recs.length > 1) {
        h += '<div class="panel"><h2>Other challenges that fit</h2><div class="alts">' +
          recs.slice(1, 9).map(function (r) {
            return '<a class="alt" href="#/c/' + esc(r.challenge.slug) + '"><span class="score">' + r.match_score +
              '%</span><span class="who"><b>' + esc(r.challenge.firm.name) + " — " + esc(r.challenge.name) +
              "</b><span>" + sizeLabel(r.challenge.account_size) + " · " + (money(r.challenge.price) || "price not confirmed") +
              '</span></span><span class="pill">' + esc(r.label || PF.matchLabel(r.match_score)) + "</span></a>";
          }).join("") + "</div></div>";
      }
    }
    var elim = lastResult.eliminated || [];
    if (elim.length) {
      var by = {}, ex = {};
      elim.forEach(function (e) {
        var f = (e.eliminations && e.eliminations[0]) || null, k = f ? f.requirement : "other";
        by[k] = (by[k] || 0) + 1; if (f && !ex[k]) ex[k] = f.message;
      });
      h += '<div class="panel elim"><h2>What your answers ruled out</h2><p>' + elim.length + " of " +
        DATA.length + " challenges were removed outright, not scored low.</p><ul>" +
        Object.keys(by).sort(function (a, b) { return by[b] - by[a]; }).slice(0, 6).map(function (k) {
          return "<li><span>" + esc(ex[k] || titleCase(k)) + '</span><span class="count">removes ' + by[k] + "</span></li>";
        }).join("") + "</ul></div>";
    }
    return h + '<div class="actions"><button type="button" class="btn btn-primary" data-act="again">Change my answers</button></div></div>';
  }

  // ---- Browse -----------------------------------------------------------
  var filters = { q: "", market: "", size: "", max_price: "", platform: "", sort: "price" };

  function viewBrowse() {
    var platforms = {}; DATA.forEach(function (c) { (c.platforms || []).forEach(function (p) { platforms[p] = 1; }); });
    var sizes = {}; DATA.forEach(function (c) { if (c.account_size) sizes[c.account_size] = 1; });
    var opt = function (v, l, cur) { return '<option value="' + esc(v) + '"' + (cur === v ? " selected" : "") + ">" + esc(l) + "</option>"; };

    var list = DATA.filter(function (c) {
      if (filters.q) {
        var hay = (c.name + " " + c.firm.name).toLowerCase();
        if (hay.indexOf(filters.q.toLowerCase()) === -1) return false;
      }
      if (filters.market && (c.markets || []).indexOf(filters.market) === -1) return false;
      if (filters.size && String(c.account_size) !== filters.size) return false;
      if (filters.max_price && (c.price == null || c.price > Number(filters.max_price))) return false;
      if (filters.platform && (c.platforms || []).indexOf(filters.platform) === -1) return false;
      return true;
    });

    list.sort(function (a, b) {
      if (filters.sort === "price") {
        if (a.price == null) return 1; if (b.price == null) return -1; return a.price - b.price;
      }
      if (filters.sort === "size") return (a.account_size || 0) - (b.account_size || 0);
      return a.firm.name.localeCompare(b.firm.name) || a.name.localeCompare(b.name);
    });

    var h = '<div class="section stack"><div><span class="eyebrow">Directory</span>' +
      "<h1>Browse every challenge</h1><p>The full catalogue, filterable. If you'd rather have it narrowed " +
      'down for you, <a href="#/find">answer a few questions instead</a>.</p></div>' +
      '<div class="panel"><div class="filters">' +
      '<div class="field"><label for="f-q">Search</label><input id="f-q" data-f="q" value="' + esc(filters.q) + '" placeholder="firm or plan"></div>' +
      '<div class="field"><label for="f-market">Market</label><select id="f-market" data-f="market">' +
      opt("", "Any", filters.market) + V.MARKETS.map(function (m) { return opt(m, titleCase(m), filters.market); }).join("") + "</select></div>" +
      '<div class="field"><label for="f-size">Account size</label><select id="f-size" data-f="size">' +
      opt("", "Any", filters.size) + Object.keys(sizes).sort(function (a, b) { return a - b; })
        .map(function (s) { return opt(s, sizeLabel(Number(s)), filters.size); }).join("") + "</select></div>" +
      '<div class="field"><label for="f-price">Max price</label><input id="f-price" data-f="max_price" type="number" min="0" value="' + esc(filters.max_price) + '" placeholder="Any"></div>' +
      '<div class="field"><label for="f-platform">Platform</label><select id="f-platform" data-f="platform">' +
      opt("", "Any", filters.platform) + Object.keys(platforms).sort().map(function (p) { return opt(p, p, filters.platform); }).join("") + "</select></div>" +
      '<div class="field"><label for="f-sort">Sort by</label><select id="f-sort" data-f="sort">' +
      opt("price", "Price, low to high", filters.sort) + opt("size", "Account size", filters.sort) +
      opt("firm", "Firm name", filters.sort) + "</select></div></div></div>" +
      '<p class="eyebrow">' + list.length + " of " + DATA.length + " challenges</p>";

    h += list.length ? '<div class="grid-cards">' + list.slice(0, 120).map(card).join("") + "</div>" +
      (list.length > 120 ? '<p class="empty">Showing the first 120. Narrow the filters to see the rest.</p>' : "")
      : '<div class="empty">Nothing matches those filters.</div>';
    return h + "</div>";
  }

  function card(c) {
    return '<article class="card"><div><h3><a href="#/c/' + esc(c.slug) + '">' + esc(c.name) + "</a></h3>" +
      '<div class="firm"><a href="#/f/' + esc(c.firm.slug) + '">' + esc(c.firm.name) + "</a></div></div>" +
      '<div class="kv">' +
      "<div><span>Account</span><b>" + sizeLabel(c.account_size) + "</b></div>" +
      "<div><span>Price</span><b>" + (money(c.price) || '<i class="unknown">—</i>') + "</b></div>" +
      "<div><span>Max drawdown</span><b>" + (pct(c.max_drawdown_pct) || '<i class="unknown">—</i>') + "</b></div>" +
      "<div><span>Profit target</span><b>" + (pct(c.profit_target_pct) || '<i class="unknown">—</i>') + "</b></div>" +
      '</div><div class="foot"><span class="pill ' + ruleTone(c.rules.news_trading) + '">News: ' +
      titleCase(c.rules.news_trading) + '</span><span class="pill ' + ruleTone(c.rules.overnight) + '">Overnight: ' +
      titleCase(c.rules.overnight) + "</span></div></article>";
  }

  // ---- Challenge detail -------------------------------------------------
  function viewChallenge(slug) {
    var c = DATA.filter(function (x) { return x.slug === slug; })[0];
    if (!c) return '<div class="empty">Challenge not found.</div>';
    var siblings = FIRMS[c.firm.slug].challenges.filter(function (x) { return x.slug !== slug; });
    var row = function (k, v) { return "<div><dt>" + k + "</dt><dd>" + (v == null || v === "" ? '<span class="unknown">Not confirmed</span>' : v) + "</dd></div>"; };
    var rl = function (k, v) { return "<div><dt>" + k + '</dt><dd><span class="pill ' + ruleTone(v) + '">' + titleCase(v) + "</span></dd></div>"; };

    var h = '<div class="section stack"><div><span class="eyebrow"><a href="#/f/' + esc(c.firm.slug) + '">' +
      esc(c.firm.name) + "</a></span><h1>" + esc(c.name) + "</h1>" +
      '<div class="pills" style="margin-top:0.7rem">' +
      (c.last_verified_at ? '<span class="pill pill-accent">Verified</span>' : '<span class="pill pill-warn">Not verified</span>') +
      (c.markets || []).map(function (m) { return '<span class="pill">' + esc(m) + "</span>"; }).join("") +
      (c.phases === 0 ? '<span class="pill">Instant funding</span>' : '<span class="pill">' + c.phases + "-step</span>") +
      "</div></div>" +
      '<div class="panel"><div class="spec"><dl>' +
      row("Account size", sizeLabel(c.account_size)) +
      row("Price", money(c.price)) +
      row("Profit target", pct(c.profit_target_pct)) +
      row("Max drawdown", pct(c.max_drawdown_pct)) +
      row("Daily loss limit", c.daily_drawdown_pct == null ? "<span class='unknown'>None recorded</span>" : pct(c.daily_drawdown_pct)) +
      row("Drawdown type", c.drawdown_type ? titleCase(c.drawdown_type) : null) +
      "</dl><dl>" +
      row("Minimum trading days", c.minimum_days) +
      row("Maximum days", c.maximum_days) +
      row("Profit split", pct(c.payout_split_pct)) +
      row("Payout frequency", c.payout_frequency_days ? c.payout_frequency_days + " days" : null) +
      row("Platforms", (c.platforms || []).join(", ")) +
      row("Leverage", c.leverage) +
      "</dl></div>" +
      (c.payout_conditions ? "<p>" + esc(c.payout_conditions) + "</p>" : "") + "</div>" +
      '<div class="panel"><h2>Rules</h2><div class="spec"><dl>' +
      rl("News trading", c.rules.news_trading) + rl("Overnight", c.rules.overnight) +
      rl("Weekend", c.rules.weekend) + rl("Automated trading", c.rules.ea_allowed) +
      "</dl><dl>" +
      rl("Copy trading", c.rules.copy_trading) + rl("Scalping", c.rules.scalping) +
      rl("Hedging", c.rules.hedging) +
      row("Consistency rule", c.rules.consistency_rule === "required"
        ? "Required" + (c.rules.consistency_pct ? " (" + c.rules.consistency_pct + "%)" : "")
        : c.rules.consistency_rule === "not_required" ? "Not required" : null) +
      "</dl></div>" +
      '<p class="unknown" style="margin-top:0.9rem">An unconfirmed rule never reads as allowed. It does not ' +
      "eliminate a challenge, but it scores below a confirmed restriction and warns you when it matters.</p></div>";

    if (siblings.length) {
      h += '<div class="panel"><h2>Other challenges from ' + esc(c.firm.name) + "</h2>" +
        '<div class="alts">' + siblings.slice(0, 10).map(function (s) {
          return '<a class="alt" href="#/c/' + esc(s.slug) + '"><span class="score">' + sizeLabel(s.account_size) +
            '</span><span class="who"><b>' + esc(s.name) + "</b><span>" + (money(s.price) || "price not confirmed") +
            "</span></span></a>";
        }).join("") + "</div></div>";
    }
    return h + '<div class="actions"><a class="btn btn-primary" href="#/find">See if this fits how you trade</a>' +
      '<a class="btn" href="#/browse">Back to directory</a></div></div>';
  }

  // ---- Firms ------------------------------------------------------------
  function viewFirms() {
    return '<div class="section stack"><div><span class="eyebrow">Firms</span><h1>Every firm in the catalogue</h1>' +
      "<p>" + FIRM_LIST.length + " firms. Challenge counts and ranges are computed from what is on file, so they " +
      "never imply coverage we do not have.</p></div>" +
      '<div class="grid-cards">' + FIRM_LIST.map(function (f) {
        var sizes = f.challenges.map(function (c) { return c.account_size; }).filter(Boolean);
        var prices = f.challenges.map(function (c) { return c.price; }).filter(function (p) { return p != null; });
        return '<article class="card"><div><h3><a href="#/f/' + esc(f.firm.slug) + '">' + esc(f.firm.name) + "</a></h3>" +
          '<div class="firm">' + f.challenges.length + " challenge" + (f.challenges.length === 1 ? "" : "s") +
          (sizes.length ? " · " + sizeLabel(Math.min.apply(null, sizes)) + " – " + sizeLabel(Math.max.apply(null, sizes)) : "") +
          (prices.length ? " · from " + money(Math.min.apply(null, prices)) : "") + "</div></div>" +
          '<div class="foot">' + (f.firm.website ? '<span class="pill pill-accent">Site on file</span>' : '<span class="pill">No site on file</span>') + "</div></article>";
      }).join("") + "</div></div>";
  }

  function viewFirm(slug) {
    var f = FIRMS[slug];
    if (!f) return '<div class="empty">Firm not found.</div>';
    var people = [];
    try { people = JSON.parse(f.firm.key_people || "[]"); } catch (e) { people = []; }
    var hasLeadership = f.firm.ceo || people.length || f.firm.headquarters || f.firm.founded_year;
    var sizes = f.challenges.map(function (c) { return c.account_size; }).filter(Boolean);
    var prices = f.challenges.map(function (c) { return c.price; }).filter(function (p) { return p != null; });

    var h = '<div class="section stack"><div><span class="eyebrow"><a href="#/firms">Firms</a></span><h1>' +
      esc(f.firm.name) + "</h1><p>" + f.challenges.length + " challenge" + (f.challenges.length === 1 ? "" : "s") +
      (sizes.length ? " · " + sizeLabel(Math.min.apply(null, sizes)) + " – " + sizeLabel(Math.max.apply(null, sizes)) : "") +
      (prices.length ? " · from " + money(Math.min.apply(null, prices)) : "") + "</p>" +
      (f.firm.website ? '<div class="actions"><a class="btn btn-primary" href="' + esc(f.firm.website) +
        '" target="_blank" rel="nofollow noopener">Go to ' + esc(f.firm.name) + "'s official site</a></div>" +
        '<p class="unknown">This goes straight to their own website. We are not affiliated with them and earn nothing if you sign up.</p>'
        : '<p class="unknown">We do not have this firm\'s official link on file, so we are not sending you to a page we have not checked.</p>') +
      "</div>";

    h += '<div class="panel"><h2>Who runs this firm</h2>';
    if (hasLeadership) {
      h += '<div class="spec"><dl>' +
        (f.firm.ceo ? "<div><dt>Chief executive</dt><dd>" + esc(f.firm.ceo) + "</dd></div>" : "") +
        people.map(function (p) { return "<div><dt>" + esc(p.role || "Key person") + "</dt><dd>" + esc(p.name) + "</dd></div>"; }).join("") +
        (f.firm.headquarters ? "<div><dt>Headquarters</dt><dd>" + esc(f.firm.headquarters) + "</dd></div>" : "") +
        (f.firm.founded_year ? "<div><dt>Founded</dt><dd>" + f.firm.founded_year + "</dd></div>" : "") +
        "</dl></div>";
    } else {
      h += "<p>This firm has not been recorded as publicly naming the people who run it.</p>" +
        '<p class="unknown">That is not an accusation — plenty of legitimate firms keep a low profile, and we may ' +
        "simply not have researched it yet. But when you are sending money to a company, who stands behind it is " +
        "worth knowing, so we show the gap rather than hiding it.</p>";
    }
    h += "</div>";

    return h + '<div><h2>Available challenges</h2><div class="grid-cards">' +
      f.challenges.slice().sort(function (a, b) { return (a.account_size || 0) - (b.account_size || 0); })
        .map(card).join("") + "</div></div></div>";
  }

  // ---- Compare ----------------------------------------------------------
  var compare = [];
  function viewCompare() {
    var picked = compare.map(function (s) { return DATA.filter(function (c) { return c.slug === s; })[0]; }).filter(Boolean);
    var h = '<div class="section stack"><div><span class="eyebrow">Compare</span><h1>Put challenges side by side</h1>' +
      "<p>Pick up to three. Blank cells are fields nobody has confirmed yet, not zeros.</p></div>" +
      '<div class="panel"><div class="field"><label for="cmp">Add a challenge</label><select id="cmp"><option value="">Choose…</option>' +
      DATA.slice().sort(function (a, b) { return a.firm.name.localeCompare(b.firm.name); }).map(function (c) {
        return '<option value="' + esc(c.slug) + '">' + esc(c.firm.name) + " — " + esc(c.name) + "</option>";
      }).join("") + "</select></div></div>";

    if (!picked.length) return h + '<div class="empty">Nothing selected yet.</div></div>';

    var rows = [
      ["Account size", function (c) { return sizeLabel(c.account_size); }],
      ["Price", function (c) { return money(c.price); }],
      ["Profit target", function (c) { return pct(c.profit_target_pct); }],
      ["Max drawdown", function (c) { return pct(c.max_drawdown_pct); }],
      ["Daily loss limit", function (c) { return pct(c.daily_drawdown_pct); }],
      ["Drawdown type", function (c) { return c.drawdown_type ? titleCase(c.drawdown_type) : null; }],
      ["Phases", function (c) { return c.phases === 0 ? "Instant" : c.phases; }],
      ["Profit split", function (c) { return pct(c.payout_split_pct); }],
      ["Platforms", function (c) { return (c.platforms || []).join(", "); }],
      ["News trading", function (c) { return titleCase(c.rules.news_trading); }],
      ["Overnight", function (c) { return titleCase(c.rules.overnight); }]
    ];
    h += '<div class="panel scroll-x"><table><thead><tr><th></th>' + picked.map(function (c) {
      return "<th>" + esc(c.firm.name) + "<br>" + esc(c.name) + "</th>"; }).join("") + "</tr></thead><tbody>" +
      rows.map(function (r) {
        return "<tr><td>" + r[0] + "</td>" + picked.map(function (c) {
          var v = r[1](c);
          return '<td class="num">' + (v == null || v === "" ? '<span class="unknown">—</span>' : esc(v)) + "</td>";
        }).join("") + "</tr>";
      }).join("") + "</tbody></table></div>" +
      '<div class="actions"><button type="button" class="btn" data-act="clear">Clear</button></div>';
    return h + "</div>";
  }

  // ---- Client-side islands ---------------------------------------------
  // The real React components from the app, not rewrites. They were always
  // client-side, so they run here unchanged.
  function viewPsychology() {
    return '<div class="section"><span class="eyebrow">Trading psychology</span>' +
      "<h1>The behavioural half of passing a challenge</h1>" +
      "<p class='lede'>Most evaluations are lost to a moved stop, a revenge trade, or size that grew " +
      "after a good week — not to picking the wrong firm.</p>" +
      "<p class='unknown' style='margin-top:0.6rem'>Everything you type here stays in this browser. " +
      "There is no server behind this page.</p>" +
      '<div id="island-psychology" style="margin-top:1.5rem"></div></div>';
  }

  function viewTools() {
    return '<div class="section stack"><div><span class="eyebrow">Tools</span>' +
      "<h1>Work out the numbers before you buy</h1>" +
      "<p class='lede'>Two calculators that answer the questions a challenge page rarely does.</p></div>" +
      '<div class="panel"><h2>Drawdown calculator</h2><div id="island-drawdown"></div></div>' +
      '<div class="panel"><h2>Challenge calculator</h2><div id="island-challenge"></div></div></div>';
  }

  // ---- Router -----------------------------------------------------------
  function render() {
    var hash = location.hash || "#/";
    var parts = hash.replace(/^#\//, "").split("/");
    var key = parts[0] || "";
    var html;
    if (key === "find") html = viewFind();
    else if (key === "results") html = viewResults();
    else if (key === "browse") html = viewBrowse();
    else if (key === "firms") html = viewFirms();
    else if (key === "f") html = viewFirm(parts[1]);
    else if (key === "c") html = viewChallenge(decodeURIComponent(parts[1] || ""));
    else if (key === "compare") html = viewCompare();
    else if (key === "psychology") html = viewPsychology();
    else if (key === "tools") html = viewTools();
    else html = viewHome();
    app.innerHTML = html;

    document.getElementById("nav").innerHTML = ROUTES.map(function (r) {
      var on = r[0] === "#/" ? hash === "#/" || hash === "" : hash.indexOf(r[0]) === 0;
      return '<a href="' + r[0] + '"' + (on ? ' aria-current="page"' : "") + ">" + r[1] + "</a>";
    }).join("");

    if (key === "" || key === "/") {
      var homeEl = document.getElementById("island-home");
      if (homeEl && window.PFMount) window.PFMount(homeEl, "home", {});
    }
    if (key === "psychology") {
      var el = document.getElementById("island-psychology");
      if (el && window.PFMount) window.PFMount(el, "psychology", {});
    }
    if (key === "tools") {
      [["island-drawdown", "drawdown"], ["island-challenge", "challenge"]].forEach(function (m) {
        var node = document.getElementById(m[0]);
        if (node && window.PFMount) window.PFMount(node, m[1], {});
      });
    }
    if (key === "find") bindFind();
    if (key === "browse") {
      app.querySelectorAll("[data-f]").forEach(function (el) {
        var ev = el.tagName === "SELECT" ? "change" : "input";
        el.addEventListener(ev, function () {
          filters[el.getAttribute("data-f")] = el.value;
          var pos = el.selectionStart;
          render();
          var again = document.getElementById(el.id);
          if (again) { again.focus(); if (pos != null && again.setSelectionRange) { try { again.setSelectionRange(pos, pos); } catch (e) {} } }
        });
      });
    }
    if (key === "compare") {
      var sel = document.getElementById("cmp");
      if (sel) sel.addEventListener("change", function () {
        if (sel.value && compare.indexOf(sel.value) === -1 && compare.length < 3) compare.push(sel.value);
        render();
      });
    }
    app.querySelectorAll('[data-act="again"]').forEach(function (b) {
      b.addEventListener("click", function () { step = 0; answers = { deal_breakers: [] }; location.hash = "#/find"; });
    });
    app.querySelectorAll('[data-act="clear"]').forEach(function (b) {
      b.addEventListener("click", function () { compare = []; render(); });
    });
    window.scrollTo({ top: 0, behavior: "instant" });
  }

  window.addEventListener("hashchange", render);
  render();
})();
</script>
