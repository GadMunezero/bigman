# Production stack for a single small VM: the app, plus Caddy in front of it
# for automatic HTTPS.
#
# Caddy exists here for one reason worth stating: it obtains and renews a
# Let's Encrypt certificate on its own, with no cron job and no certbot. On a
# free-tier box that you will not log into for months, a certificate that
# renews itself is the difference between a site that stays up and one that
# breaks in ninety days.
#
#   cp deploy/.env.example deploy/.env    # then edit it
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Pinned so volume names are predictable. Without it the project name comes
# from the directory holding this file, making the data volume `deploy_...`,
# and the backup command in docs/HOSTING-FREE.md would name a volume that does
# not exist.
name: bigman

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        # Build-time, not runtime — Next.js inlines NEXT_PUBLIC_* during the
        # build, and /sitemap.xml and /robots.txt are prerendered. Change your
        # domain and you must rebuild, not just restart.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    restart: unless-stopped
    env_file: .env
    environment:
      # The database lives on the volume, never in the image. Rebuilding the
      # app must not touch a single row a human typed in /admin.
      DATABASE_PATH: /data/app.db
      PORT: "3000"
    volumes:
      - propfirm-data:/data
    # Not published to the host: Caddy is the only way in, so there is no
    # plaintext port open to the internet on 3000.
    expose:
      - "3000"
    healthcheck:
      # `/` renders without a session or a write, so it is a true liveness
      # check rather than a check that also exercises the database.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Named individually rather than `env_file: .env`, so the admin password
    # is not handed to a container that has no use for it.
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates survive a restart. Without this volume every `up` asks
      # Let's Encrypt for a new certificate and you will hit their rate limit.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  propfirm-data:
  caddy-data:
  caddy-config:
